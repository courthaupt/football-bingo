<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Bingo</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --ink: #1d2420; --muted: #5b655f;
    --accent: #2f6b3a; --mark: #d9a521; --line: #c9cfc9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141815; --card: #1f2520; --ink: #e8ece8; --muted: #9aa69d;
            --accent: #5fae6c; --mark: #b8891a; --line: #39413b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
              padding: 12px 16px; max-width: 1100px; margin: 0 auto; }
  label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: 4px; }
  input[type=number], select, textarea {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); color: var(--ink); }
  textarea { width: 100%; min-height: 160px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  details { max-width: 1100px; margin: 0 auto; padding: 0 16px 12px; }
  summary { cursor: pointer; color: var(--muted); }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
           gap: 20px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  .card { min-width: 0; background: var(--card); border: 2px solid var(--accent); border-radius: 10px; padding: 10px; }
  .card h2 { margin: 0 0 8px; display: grid; grid-template-columns: repeat(5, 1fr);
             text-align: center; color: var(--accent); font-size: 1.6rem; letter-spacing: .05em; }
  .card .num { font-size: .75rem; color: var(--muted); text-align: right; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 4px;
          display: flex; align-items: center; justify-content: center; text-align: center;
          padding: 3px; font-size: .68rem; line-height: 1.15; cursor: pointer;
          user-select: none; min-width: 0; overflow: hidden;
          overflow-wrap: break-word; hyphens: auto; }
  .cell.marked { background: var(--mark); color: #1d2420; font-weight: 600; }
  .cell.free { background: var(--accent); color: #fff; font-weight: 700; }
  .card.bingo { box-shadow: 0 0 0 4px var(--mark); }
  @media print {
    header, .controls, details { display: none; }
    body { background: #fff; color: #000; }
    #cards { grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { break-inside: avoid; border-color: #000; }
    .cell.marked { background: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🏈 Football Bingo</h1>
  <p>Make random game-day bingo cards. Tap a square to mark it, or print them out.</p>
</header>

<div class="controls">
  <label>Square set
    <select id="preset">
      <option value="nfl">American football (NFL)</option>
      <option value="soccer">Soccer</option>
    </select>
  </label>
  <label>Number of cards
    <input id="count" type="number" min="1" max="100" value="4">
  </label>
  <label><span><input id="free" type="checkbox" checked> Free center square</span></label>
  <button id="generate">New cards</button>
  <button id="clear" class="secondary">Clear marks</button>
  <button id="print" class="secondary">Print</button>
</div>

<details>
  <summary>Edit squares (one per line, at least 24 with the free space)</summary>
  <textarea id="squares"></textarea>
</details>

<div id="cards"></div>

<script src="squares.js"></script>
<script src="app.js"></script>
</body>
</html>
